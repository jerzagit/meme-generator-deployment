<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Papa Meme Generator | Modern Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Tech Papa Meme Generator :')</h1>
    
    <div class="card">
      <div class="input-group">
        <label for="imageInput" class="custom-file-upload">
          Choose Image
        </label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="controls">
        <input type="text" id="topText" placeholder="Top Text">
        <input type="text" id="bottomText" placeholder="Bottom Text">
        <div class="button-group">
          <button id="generate" onclick="generateMeme()">Generate</button>
          <button id="download" onclick="downloadMeme()">Download</button>
        </div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="memeCanvas" width="800" height="450"></canvas>
    </div>

        <div class="support-container">
      <h3>Support the Project</h3>
      <a href="https://www.buymeacoffee.com/YTOo1eT8Y6" target="_blank" class="coffee-button-modern">
        <img src="https://img.buymeacoffee.com/button-api/?text=Buy me a coffee&emoji=&slug=YTOo1eT8Y6&button_colour=FFDD00&font_colour=000000&font_family=Inter&outline_colour=000000&coffee_colour=ffffff" />
      </a>
      
      <div class="supporters-wall">
        <h4>Special Shoutouts (Supporters)</h4>
        <ul id="supportersList">
          <!-- Add your supporters here -->
          <li><a href="https://twitter.com/supporter1" target="_blank">@SupporterName1</a></li>
          <li><a href="#" target="_blank">Another Legend</a></li>
        </ul>
      </div>
    </div>

    <footer>
      <p>Thank you for using this tool!</p>
      <div class="credits">
        <p>Developed by **techpapa** | Original post by **Timothy Olanrewaju**</p>
      </div>
    </footer>


  </div>

  <script src="script.js"></script>
</body>
</html>
