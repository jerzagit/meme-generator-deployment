<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Papa Meme Generator | Modern Dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Meme Generator</h1>
    
    <div class="card">
      <div class="input-group">
        <label for="imageInput" class="custom-file-upload">
          Choose Image
        </label>
        <input type="file" id="imageInput" accept="image/*">
      </div>

      <div class="controls">
        <input type="text" id="topText" placeholder="Top Text">
        <input type="text" id="bottomText" placeholder="Bottom Text">
        <div class="button-group">
          <button id="generate" onclick="generateMeme()">Generate</button>
          <button id="download" onclick="downloadMeme()">Download</button>
        </div>
      </div>
    </div>

    <div class="canvas-container">
      <canvas id="memeCanvas" width="800" height="450"></canvas>
    </div>

    <footer>
      <p>Thank you for using this tool!</p>
      
      <div class="contributors">
        <p><strong>Developed by:</strong> techpapa</p>
        <p><strong>Original concept:</strong> Timothy Olanrewaju</p>
        <p><strong>Contributors:</strong> [Add Names Here]</p>
      </div>

      <div class="support-us">
        <a href="https://www.buymeacoffee.com/yourusername" target="_blank" class="coffee-button">
          <img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me A Coffee" style="height: 40px !important;width: 145px !important;" >
        </a>
      </div>
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
